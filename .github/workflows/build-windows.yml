name: Build Windows (x64)

on:
  push:
    branches:
      - main
      - dev*
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    env:
      COREPACK_ENABLE_STRICT: "0"

    steps:
      # 1. 检出桌面客户端源码（使用最新 v7 版本，包含 dashboard 等子模块）
      - name: Checkout sing-box-for-desktop
        uses: actions/checkout@v7
        with:
          path: sing-box-for-desktop
          submodules: recursive
          fetch-depth: 1

      # 2. 检出 sing-box 官方内核源码到同级目录（获取完整历史与 tags 以供版本检测）
      - name: Checkout sing-box core
        uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          path: sing-box
          fetch-depth: 0

      # 3. 设置 Go 编译环境（使用最新 v7 版本）
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      # 4. 设置 Rust 工具链（编译 native/windows-share，仅 x64 架构，关闭根目录缓存查找）
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: "x86_64-pc-windows-msvc"
          cache: false

      # 5. 设置 pnpm（使用最新 v2 版本）与 Node.js（v7）
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 6. 禁用 corepack 并修复子模块中的损坏 pnpm 版本声明 (pnpm@11.13.0 -> pnpm@11.22.0)
      - name: Fix Submodule pnpm Version and Disable Corepack
        shell: pwsh
        working-directory: sing-box-for-desktop
        run: |
          corepack disable
          Get-ChildItem -Path . -Filter "package.json" -Recurse | ForEach-Object {
            (Get-Content $_.FullName) -replace 'pnpm@11.13.0', 'pnpm@11.22.0' | Set-Content $_.FullName
          }

      # 7. 生成临时代码签名自签名证书与 signing.local.json
      - name: Generate Self-Signed Certificate
        shell: pwsh
        working-directory: sing-box-for-desktop
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\CurrentUser\My -DnsName "sing-box-desktop" -Type CodeSigningCert
          $password = ConvertTo-SecureString -String "SecretPassword123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "temp-cert.pfx" -Password $password
          @{
            windows = @{
              certificateFile = "temp-cert.pfx"
              certificatePassword = "SecretPassword123"
            }
          } | ConvertTo-Json | Set-Content "signing.local.json"

      # 8. 安装主项目与 dashboard 子模块依赖
      - name: Install Dependencies
        working-directory: sing-box-for-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm -C dashboard install --frozen-lockfile

      # 9. 仅打包 x64 架构
      - name: Package Windows x64
        working-directory: sing-box-for-desktop
        run: pnpm package:win x64

      # 10. 上传生成的 x64 安装包产物（使用最新 v7 版本）
      - name: Upload x64 Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-windows-x64
          path: |
            sing-box-for-desktop/release/*.exe
            sing-box-for-desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
